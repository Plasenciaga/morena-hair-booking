<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MORENA Admin</title>
  <link rel="stylesheet" href="/style.css?v=20260810-2">
  <style>
    body{background:#eee5df}
    .adminbar{background:#111;color:#fff;padding:18px 0}
    .adminbar .shell{display:flex;justify-content:space-between;align-items:center}
    .adminmain{padding:32px 0 60px}
    .panel{background:#f8f2ee;border:1px solid #cfc3bc;border-radius:10px;padding:22px;margin-bottom:18px}
    .panel h2{font-family:Georgia,serif;margin-top:0}
    .row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .table{width:100%;border-collapse:collapse;font-size:12px}
    .table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #d5c9c2;vertical-align:top}
    .danger{background:#7e2525;color:white;border:0;padding:7px 10px;cursor:pointer}
    .muted{color:#766e68}
    #dashboard[hidden],#loginBox[hidden]{display:none}
    @media(max-width:800px){.row{grid-template-columns:1fr 1fr}.table{display:block;overflow-x:auto}}
    @media(max-width:520px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="adminbar">
  <div class="shell">
    <strong>MORENA · ADMIN</strong>
    <button id="logoutBtn" class="btn btn-dark" hidden>LOGOUT</button>
  </div>
</div>

<main class="adminmain shell">
  <section id="loginBox" class="panel" style="max-width:520px;margin:40px auto">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <label>E-Mail<input id="loginEmail" type="email" required></label>
      <label>Passwort<input id="loginPassword" type="password" required></label>
      <button class="btn btn-dark" type="submit">EINLOGGEN</button>
      <p id="loginMsg" class="message"></p>
    </form>
  </section>

  <div id="dashboard" hidden>
    <section class="panel">
      <h2>Freie Zeiten eintragen</h2>
      <p class="muted">Diese Zeiten erscheinen sofort bei den Kundinnen. Du kannst einen einzelnen Termin oder direkt mehrere Uhrzeiten für einen Tag anlegen.</p>

      <h3 style="margin:20px 0 8px">Mehrere Slots für einen Tag</h3>
      <form id="bulkSlotForm" class="row">
        <label>Datum<input id="bulkDate" type="date" required></label>
        <label>Von<input id="bulkFrom" type="time" value="10:00" required></label>
        <label>Bis<input id="bulkTo" type="time" value="18:00" required></label>
        <label>Abstand
          <select id="bulkInterval">
            <option value="30">30 Minuten</option>
            <option value="45">45 Minuten</option>
            <option value="60" selected>60 Minuten</option>
            <option value="90">90 Minuten</option>
          </select>
        </label>
        <div style="align-self:end"><button class="btn btn-dark" type="submit">ZEITEN ERSTELLEN</button></div>
      </form>
      <p id="bulkSlotMsg" class="message"></p>

      <h3 style="margin:26px 0 8px">Einzelnen Slot anlegen</h3>
      <form id="slotForm" class="row">
        <label>Datum & Uhrzeit<input id="slotStart" type="datetime-local" required></label>
        <div style="align-self:end"><button class="btn btn-dark" type="submit">SLOT SPEICHERN</button></div>
      </form>
      <p id="slotMsg" class="message"></p>
    </section>

    <section class="panel">
      <h2>Leistung hinzufügen</h2>
      <form id="serviceForm" class="row">
        <label>Name<input id="svName" required placeholder="z.B. Silk Press"></label>
        <label>Preis CHF<input id="svPrice" type="number" step="0.05" min="0" required></label>
        <label>Dauer Minuten<input id="svDuration" type="number" min="15" step="15" value="60" required></label>
        <label>Beschreibung<input id="svDescription" placeholder="Kurze Beschreibung"></label>
        <div><button class="btn btn-dark" type="submit">SERVICE SPEICHERN</button></div>
      </form>
    </section>

    <section class="panel">
      <h2>Slots</h2>
      <div id="slotTable"></div>
    </section>

    <section class="panel">
      <h2>Buchungen</h2>
      <div id="bookingTable"></div>
    </section>

    <section class="panel">
      <h2>Services</h2>
      <div id="serviceTable"></div>
    </section>
  </div>
</main>

<script src="/admin.js?v=20260810-2"></script>
</body>
</html>
